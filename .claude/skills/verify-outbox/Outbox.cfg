\* Scenario "one reader, two tabs": reader A, two tabs of A's open on one
\* browser, A may sign out and in again, and the outbox may start with an
\* edit saved before owners were recorded. Listed: the rules the code keeps
\* today (expected: exit 0). The rules it breaks are in check.sh's findings.
CONSTANTS
    MaxActions = 2
    SavedNote = TRUE
    SecondTab = "A"
    SignIns = "A"
    OldItem = TRUE
    Elsewhere = TRUE
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    NewNoteKept
    EditKept
    RemovalKept
    UndoKept
    NewerWins
    OnlyYourSession
    OnlyYourPage
    StaysYours
    StoredOnce
    DroppedOnlyWhenSaved
    RefusedKept
    RefusedSkipped
    RefusedOnlyForYou
CHECK_DEADLOCK FALSE
