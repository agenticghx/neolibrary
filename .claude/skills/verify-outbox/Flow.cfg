\* The chart's scenario (small enough to draw every state): reader A, one tab,
\* always signed in, writes one note and may give it new words, remove it and
\* press Undo; the network may drop and come back at any point.
\* Every rule is listed, so the chart marks where each one breaks.
CONSTANTS
    MaxActions = 2
    SavedNote = FALSE
    SecondTab = "none"
    SignIns = "none"
    OldItem = FALSE
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    NewNoteKept
    EditKept
    RemovalKept
    UndoKept
    NewerWins
    OnlyYourSession
    OnlyYourPage
    StaysYours
    StoredOnce
    DroppedOnlyWhenSaved
    RefusedKept
    RefusedSkipped
    RefusedNotResent
    RefusedOnlyForYou
CHECK_DEADLOCK FALSE
