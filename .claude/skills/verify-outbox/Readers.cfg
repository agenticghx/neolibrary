\* Scenario "two readers, one browser": reader A's tab stays open; A may sign
\* out, another reader (B) may sign in and open a tab of B's own; the outbox
\* may start with an edit saved before owners were recorded. Listed: the
\* rules the code keeps today (expected: exit 0). The rules it breaks are in
\* check.sh's findings.
CONSTANTS
    MaxActions = 2
    SavedNote = TRUE
    SecondTab = "B"
    SignIns = "AB"
    OldItem = TRUE
INIT Init
NEXT Next
INVARIANTS
    TypeOK
    OnlyYourPage
    StoredOnce
    DroppedOnlyWhenSaved
    RefusedKept
    RefusedSkipped
CHECK_DEADLOCK FALSE
