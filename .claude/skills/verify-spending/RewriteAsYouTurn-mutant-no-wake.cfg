\* Broken variant (not the code): when a closed pane's loop ends, the open pane is not told (no turns.wake), so its page is never written. Expected: NeverStuck breaks (exit 12).
SPECIFICATION Spec
CONSTANTS
    NumPages = 2
    ParasPerPage = 2
    Cost = 40
    BigPara = 0
    BigCost = 0
    AskAt = 100
    RefLag = TRUE
    PaneCanClose = TRUE
    TurnBack = TRUE
    Mutant = "noWake"
INVARIANTS
    TypeOK
    NeverStuck
