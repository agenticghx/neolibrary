\* For the chart only (rewrite-as-you-turn-flow.mmd): three pages of one paragraph, read forward, so a turned-to page is rewritten and "Keep rewriting?" shows on the third. Small enough for the chart (under 500 states).
\* Expected: every rule holds (exit 0).
SPECIFICATION Spec
CONSTANTS
    NumPages = 3
    ParasPerPage = 1
    Cost = 60
    AskAt = 100
    RefLag = FALSE
    PaneCanClose = FALSE
    TurnBack = FALSE
    Mutant = "none"
INVARIANTS
    TypeOK
    AsksBeforePayingPastOneDollar
    AtMostOneParagraphPastOneDollar
    StopStopsPaying
    OneLoopAtATime
