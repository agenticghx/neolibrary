\* Finding 8 (by design): the check comes before each paragraph, so the last paragraph paid can take the total past $1. Expected: NeverPastOneDollar breaks (exit 12); AtMostOneParagraphPastOneDollar holds in the main check.
SPECIFICATION Spec
CONSTANTS
    NumPages = 2
    ParasPerPage = 2
    Cost = 60
    AskAt = 100
    RefLag = FALSE
    PaneCanClose = FALSE
    TurnBack = TRUE
    Mutant = "none"
INVARIANTS
    TypeOK
    NeverPastOneDollar
