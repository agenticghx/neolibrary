\* The code as it is, under the assumptions in SKILL.md ("What the main check assumes"): a scan and
\* its text edition (call 3 is on the edition), two copies of the server (call 3 on the second), a
\* restart, failed database writes and a text edition started meanwhile.
\* Expected: every rule holds (exit 0).
SPECIFICATION Spec
CONSTANTS
    N = 3
    SameRequest = {1, 2}
    OnEdition = {3}
    OnSecondServer = {3}
    Estimate = 2
    MaxCost = 2
    CapMonth = 3
    CapBook = 3
    CanRestart = TRUE
    SaveCanFail = TRUE
    TextEditionStart = TRUE
    TextEditionEstimate = 2
    Mutant = "none"
INVARIANTS
    TypeOK
    CapNeverPassed
    ChargedMoneyAlwaysCounted
    ReservationReleasedOnce
    EveryChargeRecordedOnce
