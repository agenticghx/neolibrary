\* The second gate (SKILL.md, "Run it"): every rule, with the open findings' cause switched off (no restart, so one
\* server). Repeated text and a failed save stay in: findings 2 and 3 were fixed in M44. Expect exit 0: a rule that
\* breaks here has a cause that is not a known finding. This does not replace NarrationFindings.cfg or
\* NarrationOverlap.cfg, which keep the open findings in view.
CONSTANTS
  Books <- CheckBooks
  Listened = "Lamps"
  CapBook = 2
  CapMonth = 2
  MaxRestarts = 0
  MaxSaveFails = 1
  OldServerLingers = FALSE
  HostGrace = FALSE
  AskWhileDraining = TRUE
  Broken = {}
SPECIFICATION Spec
INVARIANTS
  OnlyTheOwnerStarts
  OnlyAfterYouConfirm
  OneRunAtATime
  StopPaysAtMostOneMore
  SavedNeverPaidAgain
  NoMoreThanYouConfirmed
  PaidOnce
  WithinLimits
