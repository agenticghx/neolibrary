\* The chart (narration-flow.mmd, drawn with narration-view.mjs): one book of two paragraphs, no Listen bar, a monthly
\* limit of one paragraph (as in life, a whole book stops at a limit), one restart. Under 500 states, so the statechart
\* skill draws every state. Every rule is checked; PaidOnce and WithinLimits break here too (finding 1).
CONSTANTS
  Books <- FlowBooks
  Listened = "none"
  CapBook = 2
  CapMonth = 1
  MaxRestarts = 1
  MaxSaveFails = 0
  OldServerLingers = FALSE
  Broken = {}
SPECIFICATION Spec
INVARIANTS
  OnlyTheOwnerStarts
  OnlyAfterYouConfirm
  OneRunAtATime
  StopPaysAtMostOneMore
  SavedNeverPaidAgain
  NoMoreThanYouConfirmed
  PaidOnce
  WithinLimits
