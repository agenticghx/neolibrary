\* The check (SKILL.md, "Run it"): every rule that holds today. Expect exit 0 (about 250,000 states, a few seconds).
\* Bounds: two books (one repeats a paragraph's text), the Listen bar, one restart, one failed save, limits of
\* 2 paragraphs per book and 2 per month. A restart ends the old server at once.
CONSTANTS
  Books <- CheckBooks
  Listened = "Lamps"
  CapBook = 2
  CapMonth = 2
  MaxRestarts = 1
  MaxSaveFails = 1
  OldServerLingers = FALSE
  Broken = {}
SPECIFICATION Spec
INVARIANTS
  OnlyTheOwnerStarts
  OnlyAfterYouConfirm
  OneRunAtATime
  StopPaysAtMostOneMore
  SavedNeverPaidAgain
  NoMoreThanYouConfirmed
