<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your picks: mini-player B with speed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&amp;display=swap">
<style>
body{margin:0}
.t-light{--paper:#f3ede1;--raised:#faf6ee;--ink:#243239;--ink2:#3c4b52;--ink3:#5a676c;--rule:#d6ccba;--accent:#376963;--accentx:#2a524d;--onaccent:#faf6ee;--hl:#cfe0d8;--hlx:#9cc4b6;--green:#2e5a50;--shc:0 1px 1px #24323914,0 6px 14px #24323924,0 18px 30px -12px #2432392e;--shr:0 1px 2px #2432391a,0 8px 24px -8px #24323929}
.t-dark{--paper:#1b282f;--raised:#22323a;--ink:#e7ddc9;--ink2:#cdc3b0;--ink3:#a49d8e;--rule:#34454d;--accent:#6b9f95;--accentx:#8bbab0;--onaccent:#12201f;--hl:#2c4743;--hlx:#3f6a63;--green:#346659;--shc:0 1px 1px #0000004d,0 8px 18px #00000059,0 20px 34px -14px #00000073;--shr:0 1px 2px #0000004d,0 10px 28px -10px #0006}
a{color:var(--accent)}a:hover{color:var(--accentx)}
</style>
</helmet>
<div style="width: 1200px; height: 980px; display: flex; flex-direction: column; font-family: 'Source Sans 3', 'Segoe UI', sans-serif; font-size: 17px; line-height: 1.4">
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
    <div class="{{t.cls}}" style="flex: 1 1 0; box-sizing: border-box; padding: 24px 40px; background: var(--paper); color: var(--ink); display: flex; flex-direction: column; gap: 16px">
      <span style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--ink3)">{{t.label}} · desktop with the speed menu open, then phone</span>

      <div role="region" aria-label="Now playing" style="margin-top: 150px; display: flex; flex-direction: column; gap: 10px; padding: 14px 18px; border-radius: 14px; background: var(--raised); border: 1px solid var(--rule); box-shadow: var(--shr)">
        <p style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 20px; line-height: 1.5">It was on a dreary night of November that I beheld the <mark style="background: var(--hlx); color: var(--ink); border-radius: 3px; padding: 0 3px">accomplishment</mark> of my toils.</p>
        <div style="display: flex; align-items: center; gap: 12px">
          <div style="flex: none; width: 30px; height: 45px; border-radius: 2px 3px 3px 2px; background: var(--green); box-shadow: var(--shc)"></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 16px">Frankenstein</span>
            <span style="font-size: 13px; color: var(--ink3)">Ch. V · 18 min left at 1.25×</span>
          </div>
          <button type="button" aria-label="Back 15 seconds" style="flex: none; width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4M10.2 10v5M15.2 10H13v2.2h2.2V15H13"></path></svg></button>
          <button type="button" aria-label="Pause" style="flex: none; width: 48px; height: 48px; border: none; border-radius: 999px; background: var(--accent); color: var(--onaccent); display: grid; place-items: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg></button>
          <button type="button" aria-label="Forward 15 seconds" style="flex: none; width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4M9.2 10v5M14.2 10H12v2.2h2.2V15H12"></path></svg></button>
          <span style="flex: 0 0 24px"></span>
          <div style="position: relative; flex: none">
            <button type="button" aria-label="Playback speed: 1.25 times" aria-expanded="true" style="min-height: 44px; min-width: 60px; padding: 0 12px; border: 1px solid var(--accent); border-radius: 999px; background: transparent; color: var(--accent); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">1.25×</button>
            <div role="group" aria-label="Choose a speed" style="position: absolute; right: 0; bottom: calc(100% + 10px); width: 220px; box-sizing: border-box; padding: 10px; border-radius: 10px; background: var(--raised); border: 1px solid var(--rule); box-shadow: var(--shr); display: flex; flex-direction: column; gap: 8px">
              <span style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: var(--ink3)">Speed</span>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
                <sc-for list="{{speeds}}" as="sp" hint-placeholder-count="6">
                  <button type="button" aria-pressed="{{sp.pressed}}" style="min-height: 44px; border: 1px solid {{sp.border}}; border-radius: 6px; background: {{sp.bg}}; color: {{sp.fg}}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{sp.label}}</button>
                </sc-for>
              </div>
            </div>
          </div>
          <a href="#" style="flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 8px; font-weight: 600; font-size: 15px">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round"><path d="M12 6.5C9.8 5 7.3 4.6 4 5v13c3.3-.4 5.8 0 8 1.5 2.2-1.5 4.7-1.9 8-1.5V5c-3.3-.4-5.8 0-8 1.5zM12 6.5V19"></path></svg>
            Go to the page
          </a>
          <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 999px; background: transparent; color: var(--accent); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>Think aloud</button>
        </div>
      </div>

      <div role="region" aria-label="Now playing, phone" style="width: 370px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 8px 12px; border-radius: 14px; background: var(--raised); border: 1px solid var(--rule); box-shadow: var(--shr)">
        <p style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; line-height: 1.4">…that I beheld the <mark style="background: var(--hlx); color: var(--ink); border-radius: 3px; padding: 0 2px">accomplishment</mark> of my toils.</p>
        <span style="font-size: 12px; color: var(--ink3)">Frankenstein · Ch. V · 18 min left</span>
        <div style="display: flex; align-items: center; justify-content: space-between">
          <button type="button" aria-label="Playback speed: 1.25 times" style="min-height: 44px; min-width: 52px; padding: 0 8px; border: 1px solid var(--rule); border-radius: 999px; background: transparent; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">1.25×</button>
          <button type="button" aria-label="Back 15 seconds" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4M10.2 10v5M15.2 10H13v2.2h2.2V15H13"></path></svg></button>
          <button type="button" aria-label="Pause" style="width: 46px; height: 46px; border: none; border-radius: 999px; background: var(--accent); color: var(--onaccent); display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg></button>
          <button type="button" aria-label="Forward 15 seconds" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4M9.2 10v5M14.2 10H12v2.2h2.2V15H12"></path></svg></button>
          <button type="button" aria-label="Think aloud" style="width: 44px; height: 44px; border: 1px solid var(--accent); border-radius: 999px; background: transparent; color: var(--accent); display: grid; place-items: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zM5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
        </div>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    var speeds = ['0.75×', '1.0×', '1.25×', '1.5×', '1.75×', '2.0×'].map(function (l) {
      var on = l === '1.25×';
      return { label: l, pressed: on ? 'true' : 'false', bg: on ? 'var(--accent)' : 'transparent', fg: on ? 'var(--onaccent)' : 'var(--ink)', border: on ? 'var(--accent)' : 'var(--rule)' };
    });
    return { themes: [{ label: 'Light', cls: 't-light' }, { label: 'Dark', cls: 't-dark' }], speeds: speeds };
  }
}
</script>
</body>
</html>
