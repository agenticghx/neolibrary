<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, phone, option B: a shelf of spines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&amp;family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&amp;display=swap">
<style>
body{margin:0}
.t-light{--paper:#f3ede1;--raised:#faf6ee;--sunken:#e9e1d1;--ink:#243239;--ink2:#3c4b52;--ink3:#5a676c;--rule:#d6ccba;--accent:#376963;--accentx:#2a524d;--onaccent:#faf6ee;--navy:#22384a;--green:#2e5a50;--coverink:#f0e8d8;--plank:#d9cfbd;--shc:0 1px 1px #24323914,0 6px 14px #24323924,0 18px 30px -12px #2432392e;--shr:0 1px 2px #2432391a,0 8px 24px -8px #24323929}
.t-dark{--paper:#1b282f;--raised:#22323a;--sunken:#152026;--ink:#e7ddc9;--ink2:#cdc3b0;--ink3:#a49d8e;--rule:#34454d;--accent:#6b9f95;--accentx:#8bbab0;--onaccent:#12201f;--navy:#2a4459;--green:#346659;--coverink:#f0e8d8;--plank:#2b3a41;--shc:0 1px 1px #0000004d,0 8px 18px #00000059,0 20px 34px -14px #00000073;--shr:0 1px 2px #0000004d,0 10px 28px -10px #0006}
</style>
</helmet>
<div style="width: 880px; height: 940px; box-sizing: border-box; padding: 24px; display: flex; gap: 52px; background: #e4ded3; font-family: 'Source Sans 3', 'Segoe UI', sans-serif">
  <sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #3c4b52">{{t.label}}</span>
      <div class="{{t.cls}}" style="position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 36px; border: 1px solid #00000026; background: var(--paper); color: var(--ink); box-shadow: 0 24px 50px -24px #00000066; font-size: 16px; line-height: 1.4">
        <div style="padding: 28px 20px 0; display: flex; flex-direction: column; gap: 20px">
          <div style="display: flex; align-items: center; justify-content: space-between">
            <h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; font-size: 31px">Home</h1>
            <button type="button" aria-label="Import" style="width: 44px; height: 44px; border: none; border-radius: 999px; background: var(--accent); color: var(--onaccent); display: grid; place-items: center; cursor: pointer">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"></path></svg>
            </button>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px">
            <h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; font-size: 20px">Continue</h2>
            <a href="#" style="display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 10px; background: var(--raised); box-shadow: var(--shr); color: var(--ink); text-decoration: none">
              <div style="flex: none; width: 40px; height: 60px; border-radius: 2px 4px 4px 2px; background: var(--navy); box-shadow: var(--shc)"></div>
              <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
                <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; line-height: 1.2">The Structure of Scientific Revolutions</span>
                <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink3)">69%<span style="flex: 1; display: block; height: 4px; border-radius: 999px; background: var(--rule); overflow: hidden"><span style="display: block; height: 100%; width: 69%; background: var(--accent)"></span></span></span>
              </div>
            </a>
          </div>

          <div style="display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; align-items: baseline; justify-content: space-between">
              <h2 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-weight: 500; font-size: 20px">Your library</h2>
              <span style="font-size: 14px; color: var(--ink3)">10 items</span>
            </div>
            <sc-for list="{{shelves}}" as="sh" hint-placeholder-count="2">
              <div style="display: flex; flex-direction: column">
                <div style="display: flex; align-items: flex-end; gap: 5px; padding: 0 8px; min-height: 196px">
                  <sc-for list="{{sh.spines}}" as="s" hint-placeholder-count="5">
                    <a href="#" aria-label="{{s.label}}" style="position: relative; flex: none; width: {{s.w}}; height: {{s.h}}; box-sizing: border-box; border-radius: 3px 3px 1px 1px; background: {{s.bg}}; color: var(--coverink); box-shadow: var(--shc); overflow: hidden; text-decoration: none; display: flex; flex-direction: column; align-items: center; padding: 10px 0 8px">
                      <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{s.fill}}; background: #f0e8d82e; border-top: 1.5px solid #f0e8d88c"></span>
                      <span aria-hidden="true" style="position: relative; flex: 1; min-height: 0; writing-mode: vertical-rl; transform: rotate(180deg); font-family: 'Source Serif 4', Georgia, serif; font-size: {{s.fs}}; line-height: 1.1; text-align: center; overflow: hidden; padding: 0 5px">{{s.title}}</span>
                      <span aria-hidden="true" style="position: relative; flex: none; margin-top: 4px; font-size: 10px; font-weight: 600">{{s.pct}}</span>
                    </a>
                  </sc-for>
                </div>
                <div aria-hidden="true" style="height: 10px; border-radius: 2px; background: var(--plank); box-shadow: 0 5px 10px -5px #0000004d"></div>
              </div>
            </sc-for>
          </div>
        </div>

        <div role="region" aria-label="Now playing" style="position: absolute; left: 10px; right: 10px; bottom: 86px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 14px; background: var(--raised); border: 1px solid var(--rule); box-shadow: var(--shr)">
          <div style="flex: none; width: 28px; height: 42px; border-radius: 2px 3px 3px 2px; background: var(--navy)"></div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
            <span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The Structure of Scientific Revolutions</span>
            <span style="font-size: 12px; color: var(--ink3)">2 hr 3 min left</span>
          </div>
          <button type="button" aria-label="Back 15 seconds" style="flex: none; width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12a7 7 0 1 0 2.1-5M5 4v4h4M10.2 10v5M15.2 10H13v2.2h2.2V15H13"></path></svg>
          </button>
          <button type="button" aria-label="Pause" style="flex: none; width: 44px; height: 44px; border: none; border-radius: 999px; background: var(--accent); color: var(--onaccent); display: grid; place-items: center; cursor: pointer">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="fill: currentColor"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path></svg>
          </button>
          <button type="button" aria-label="Forward 15 seconds" style="flex: none; width: 44px; height: 44px; border: none; border-radius: 999px; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer">
            <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round"><path d="M19 12a7 7 0 1 1-2.1-5M19 4v4h-4M9.2 10v5M14.2 10H12v2.2h2.2V15H12"></path></svg>
          </button>
        </div>

        <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 6px 8px 14px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--sunken); border-top: 1px solid var(--rule)">
          <sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
            <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{tab.color}}; font-size: 12px; font-weight: {{tab.weight}}">
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round"><path d="{{tab.d}}"></path></svg>
              {{tab.label}}
            </a>
          </sc-for>
        </nav>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":940}}'>
class Component extends DCLogic {
  renderVals() {
    var spine = function (r) {
      var p = r[2];
      return {
        title: r[0], bg: 'var(--' + r[1] + ')', fill: Math.round(p * 100) + '%',
        pct: p >= 1 ? 'Done' : p > 0 ? Math.round(p * 100) + '%' : 'New',
        label: r[0] + ', ' + (p >= 1 ? 'finished' : p > 0 ? Math.round(p * 100) + '% read' : 'unread'),
        w: r[3] + 'px', h: r[4] + 'px', fs: r[0].length > 24 ? '11px' : '13px'
      };
    };
    var shelves = [
      { spines: [
        ['The Structure of Scientific Revolutions', 'navy', 0.69, 62, 190],
        ['Frankenstein', 'green', 0.34, 56, 172],
        ['Chip War', 'green', 0.55, 60, 182],
        ['The Grid', 'navy', 0.6, 56, 176],
        ['Power System Economics', 'green', 0.4, 64, 194]
      ].map(spine) },
      { spines: [
        ['Ninety Percent of Everything', 'navy', 0.5, 56, 180],
        ['Strange Case of Dr Jekyll and Mr Hyde', 'navy', 1, 50, 166],
        ['The Time Machine', 'green', 0, 50, 168],
        ['Normal Accidents', 'green', 0, 60, 186],
        ['Seeing Like a State', 'navy', 0, 62, 192]
      ].map(spine) }
    ];
    var tabs = [
      { label: 'Home', d: 'M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z', color: 'var(--accent)', weight: '600' },
      { label: 'Library', d: 'M4 5h3v14H4zM9 5h3v14H9zM14.5 5.6l2.9-.8 3.6 13.6-2.9.8z', color: 'var(--ink2)', weight: '400' },
      { label: 'Paths', d: 'M6 21a2 2 0 1 1 0-4a2 2 0 0 1 0 4zM18 7a2 2 0 1 1 0-4a2 2 0 0 1 0 4zM8 19h8a3 3 0 0 0 0-6H8a3 3 0 0 1 0-6h8', color: 'var(--ink2)', weight: '400' },
      { label: 'Search', d: 'M11 5a6 6 0 1 1 0 12a6 6 0 0 1 0-12zM20 20l-4.5-4.5', color: 'var(--ink2)', weight: '400' }
    ];
    return { themes: [{ label: 'Light', cls: 't-light' }, { label: 'Dark', cls: 't-dark' }], shelves: shelves, tabs: tabs };
  }
}
</script>
</body>
</html>
