# Automatic checks GitHub runs on every pull request and on main.
# Every job runs on GitHub's own free machines (ubuntu-24.04). The repository is public, so GitHub
# charges nothing and sets no monthly limit. Blacksmith's machines were used from 2026-10-15
# to 2026-11-05; Samuel stopped them for cost (2026-11-05). The version is pinned, not
# ubuntu-latest, because the reference screenshots must match the machine that drew them.
# Once a night (08:00 UTC) the browser job runs every slice, including WebKit.
# The concurrency group includes the event name, so that night run does not
# cancel a pull request, and a pull request does not cancel the night run.
# The night run starts only after this file is on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  # Started on main by the auto-merge workflow right after it merges: a merge made with the
  # workflow's own token starts no push run, and pull requests skip Safari's engine, so this
  # run is where WebKit is checked after each merge (2026-10-09).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests
    # The night run is the browser job only. Lint already ran on the push to main.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # A push to main that changes only PROGRESS.md (a ledger entry: a deploy record or a checkpoint)
      # has the same code as the commit before it, which these checks already judged. The job still
      # ends green, so "Start the deploy" below runs as before. Pull requests always run everything.
      - name: Is this a ledger-only commit on main?
        id: ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          only=no
          if [ "${{ github.event_name }}" = "push" ]; then
            files=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.files[]?.filename' || true)
            if [ "$files" = "PROGRESS.md" ]; then only=yes; fi
          fi
          echo "only=$only" >> "$GITHUB_OUTPUT"
          if [ "$only" = "yes" ]; then echo "Only PROGRESS.md changed: lint, types and unit tests are not run again."; fi
      - if: steps.ledger.outputs.only != 'yes'
        run: npm ci
      - name: Lint (ESLint + design-token rule)
        if: steps.ledger.outputs.only != 'yes'
        run: npm run lint
      - name: Type check
        if: steps.ledger.outputs.only != 'yes'
        run: npm run typecheck
      - name: Unit tests (Vitest)
        if: steps.ledger.outputs.only != 'yes'
        run: npm test

  postgres:
    # Every other test uses PGlite (Postgres inside Node). This runs the
    # migrations and the data layer on a real Postgres through postgres.js,
    # the library production uses, so production-only database bugs fail here.
    name: Real Postgres (migrations, data layer)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres:
        # The official Postgres image from Amazon's public mirror of Docker Hub's library: Docker Hub
        # limits anonymous downloads, and GitHub's shared runners hit that limit (#127, three failures
        # on 2026-10-09: "toomanyrequests: You have reached your unauthenticated pull rate limit").
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations and data layer on Postgres 18 (same major version as Railway)
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  hygiene:
    name: PR hygiene (PROGRESS.md Log entry)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: node scripts/check-pr-hygiene.mjs origin/${{ github.base_ref }}

  # The browser tests run on several machines at the same time (2026-11-05, when CI moved to GitHub's
  # free machines). The test files share one database and run as a chain, so they cannot be cut into
  # equal slices: each machine runs one group of projects (BROWSER_GROUPS in
  # scripts/ci-browser-needed.mjs) with its own server and a fresh database, repeating the few
  # projects that make the data its group needs (the owner account, Grace, the uploaded books).
  # 1. browser-plan picks the slices for this change and the machines to start.
  # 2. e2e-group runs one machine per group.
  # 3. e2e (the required check) waits for them, gathers the screenshots, and posts the grid.
  browser-plan:
    name: Browser tests (which machines)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read   # list the pull request's changed files
    outputs:
      slices: ${{ steps.pages.outputs.slices }}
      screenshots: ${{ steps.pages.outputs.screenshots }}
      groups: ${{ steps.pages.outputs.groups }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # ci-browser-needed.mjs uses only Node's own modules, so no npm ci here.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Choose which browser tests this change needs
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          all="screenshots,behavior,readalong,narration,webkit"
          emit() {
            slices="$1"
            if [ "$slices" = "none" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "slices=none" >> "$GITHUB_OUTPUT"
              echo "screenshots=false" >> "$GITHUB_OUTPUT"
              echo "webkit=false" >> "$GITHUB_OUTPUT"
              echo "groups=[]" >> "$GITHUB_OUTPUT"
              echo "No page, player, or audiobook code in this change. Browser tests are not run."
              return
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "slices=$slices" >> "$GITHUB_OUTPUT"
            case ",$slices," in
              *,screenshots,*) echo "screenshots=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "screenshots=false" >> "$GITHUB_OUTPUT" ;;
            esac
            # Pull requests skip Safari's engine (Samuel, 2026-10-09: it is the slow part); the run on
            # main after the merge, and the night run, keep it. See docs/ci-time.md.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "webkit=false" >> "$GITHUB_OUTPUT"
            else
              case ",$slices," in
                *,webkit,*|*,readalong,*) echo "webkit=true" >> "$GITHUB_OUTPUT" ;;
                *) echo "webkit=false" >> "$GITHUB_OUTPUT" ;;
              esac
            fi
            echo "Browser slices: $slices"
            skip=0
            if [ "${{ github.event_name }}" = "pull_request" ]; then skip=1; fi
            groups=$(node scripts/ci-browser-needed.mjs --groups "$slices" "$skip")
            # An empty answer would start no machine and fail the run with an unreadable fromJSON error.
            if [ -z "$groups" ]; then echo "::error::could not list the browser machines"; exit 1; fi
            echo "groups=$groups" >> "$GITHUB_OUTPUT"
            echo "Machines: $groups"
          }
          # The night run judges WebKit even when the day's pull requests skipped it.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Nightly run: every browser test, including WebKit."
            emit "$all"
            exit 0
          fi
          list="$RUNNER_TEMP/changed-files.txt"
          : > "$list"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > "$list" || : > "$list"
          else
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.files[]?.filename' > "$list" || : > "$list"
          fi
          # An empty list (the API failed, or the commit touched too many files to list) runs every slice.
          answer=$(node scripts/ci-browser-needed.mjs "$list" || true)
          case "$answer" in
            slices=none) emit none ;;
            slices=*)
              rest="${answer#slices=}"
              if printf '%s' "$rest" | grep -Eq '^(screenshots|behavior|readalong|narration|webkit)(,(screenshots|behavior|readalong|narration|webkit))*$'; then
                emit "$rest"
              else
                echo "Unexpected slice list ('$answer'). Running every browser test."
                emit "$all"
              fi
              ;;
            *)
              echo "Unexpected classifier output ('$answer'). Running every browser test."
              emit "$all"
              ;;
          esac

  e2e-group:
    name: Browser tests (${{ matrix.group }})
    needs: browser-plan
    if: needs.browser-plan.outputs.groups != '[]'
    runs-on: ubuntu-24.04
    strategy:
      # Every machine finishes, so one failure does not hide another.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.browser-plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browsers this machine needs
        run: |
          set -euo pipefail
          if [ "${{ matrix.webkit }}" = "true" ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Playwright (screenshot comparison, axe-core accessibility)
        env:
          CI_BROWSER_SLICES: ${{ needs.browser-plan.outputs.slices }}
          CI_SKIP_WEBKIT: ${{ github.event_name == 'pull_request' && '1' || '' }}
          CI_BROWSER_GROUP: ${{ matrix.group }}
        run: npx playwright test

      # The full report: the merge train's refresh-screenshots.sh reads *-actual.png from every
      # playwright-report-* artifact of a run.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.group }}
          path: |
            playwright-report/
            test-results/
            screenshots/
          retention-days: 14
      # Only the pictures, for the e2e job below (the grid check and the ci-screenshots branch).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.group }}
          path: |
            screenshots/*.png
            test-results/**/*-actual.png
            test-results/**/*-expected.png
            test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 3

  e2e:
    # This name is a required check. Renaming it leaves branch protection
    # waiting for a check that no longer exists. It passes only when every
    # machine above passed (or none had to run).
    name: Browser tests (screenshots + accessibility)
    needs: [browser-plan, e2e-group]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # push screenshots to the ci-screenshots branch
      pull-requests: write   # post the screenshot grid comment
    steps:
      - name: Every browser machine passed
        run: |
          echo "plan: ${{ needs.browser-plan.result }}; machines: ${{ needs.e2e-group.result }}; groups: ${{ needs.browser-plan.outputs.groups }}"
          if [ "${{ needs.browser-plan.result }}" != "success" ]; then echo "::error::the browser plan did not finish"; exit 1; fi
          case "${{ needs.e2e-group.result }}" in
            success) ;;
            skipped)
              if [ '${{ needs.browser-plan.outputs.groups }}' != '[]' ]; then echo "::error::machines were planned but did not run"; exit 1; fi
              echo "No browser machine had to run for this change." ;;
            *) echo "::error::a browser machine did not pass (see the Browser tests (<group>) jobs)"; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        if: always()
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: always() && needs.browser-plan.outputs.groups != '[]'
        with:
          pattern: shots-*
          merge-multiple: true
        continue-on-error: true

      - name: Require the 2x2 screenshot grid
        if: always() && needs.browser-plan.outputs.screenshots == 'true' && needs.browser-plan.outputs.groups != '[]'
        run: |
          set -euo pipefail
          missing=0
          # Pages the screenshot projects always photograph, plus a spec page
          # only when that spec's project ran. The mini-player is photographed
          # by the audiobook file. See gridPageNames in scripts/ci-browser-needed.mjs.
          node scripts/ci-browser-needed.mjs --grid e2e/pages.ts "${{ needs.browser-plan.outputs.slices }}" > "$RUNNER_TEMP/grid-pages.txt"
          mapfile -t pages < "$RUNNER_TEMP/grid-pages.txt"
          if [ "${#pages[@]}" -eq 0 ]; then
            echo "::error::the screenshot slice listed no pages"
            exit 1
          fi
          for page in "${pages[@]}"; do
            [ -n "$page" ] || continue
            for p in desktop-light desktop-dark phone-light phone-dark; do
              f="screenshots/$page-$p.png"
              if [ ! -f "$f" ]; then echo "::error::missing screenshot $f"; missing=1; fi
            done
          done
          exit $missing

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'pull_request' && (hashFiles('screenshots/*.png') != '' || hashFiles('test-results/**/*-diff.png') != '')
        env:
          GH_TOKEN: ${{ github.token }}
          DEST: pr-${{ github.event.number }}/${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          work="$RUNNER_TEMP/shots"
          git init -q "$work"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git fetch -q --depth 1 origin ci-screenshots; then git checkout -q -B ci-screenshots FETCH_HEAD; else git checkout -q --orphan ci-screenshots; fi
            mkdir -p "$DEST"
            cp "$GITHUB_WORKSPACE"/screenshots/*.png "$DEST"/ 2>/dev/null || true
            # Failed screenshot comparisons: expected / actual / diff, so a
            # session without access to CI artifacts can see what changed.
            (cd "$GITHUB_WORKSPACE" && find test-results -name '*-actual.png' -o -name '*-expected.png' -o -name '*-diff.png') | while read -r f; do
              d="$DEST/failures/$(basename "$(dirname "$f")")"; mkdir -p "$d"; cp "$GITHUB_WORKSPACE/$f" "$d/"
            done
            git add "$DEST"
            git commit -q -m "Screenshots for $DEST" || true
            if git push -q origin ci-screenshots; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Post the screenshot grid on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('screenshots/*.png') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const sha = context.payload.pull_request.head.sha;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}/raw/ci-screenshots/pr-${context.issue.number}/${sha}`;
            const files = fs.readdirSync("screenshots").filter((f) => f.endsWith(".png"));
            const pages = [...new Set(files.map((f) => f.replace(/-(desktop|phone)-(light|dark)\.png$/, "")))].sort();
            const img = (page, p) => `<img src="${base}/${page}-${p}.png" width="${p.startsWith("phone") ? 180 : 400}" alt="${page} ${p}">`;
            let body = `<!-- screenshot-grid -->\n## Screenshots for \`${sha.slice(0, 7)}\`\n\nPhone and desktop, light and dark. Made by the CI browser tests.\n`;
            for (const page of pages) {
              body += `\n### ${page}\n\n| | Light | Dark |\n|---|---|---|\n`;
              body += `| **Desktop** | ${img(page, "desktop-light")} | ${img(page, "desktop-dark")} |\n`;
              body += `| **Phone** | ${img(page, "phone-light")} | ${img(page, "phone-dark")} |\n`;
            }
            body += `\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find((c) => c.body?.startsWith("<!-- screenshot-grid -->"));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  # Starts the Deploy workflow (.github/workflows/deploy.yml, M40 S2) once every check has passed on main.
  # Deploy cannot simply wait for CI to finish (a workflow_run trigger): main's run is started by the
  # auto-merge workflow's own token, and GitHub sends no follow-on events for work that token starts,
  # except a direct start like this one. Found 2026-11-01: after #261 and #262 merged, Deploy never ran.
  # AUTO_DEPLOY (a repository variable) set to anything but "on" switches this off.
  deploy:
    name: Start the deploy
    needs: [checks, postgres, e2e]
    # always() and the three results by name: the e2e job's own needs can be skipped (no browser machine
    # for a change), and GitHub would then skip this job too without the explicit check.
    if: >-
      always() &&
      needs.checks.result == 'success' && needs.postgres.result == 'success' && needs.e2e.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.AUTO_DEPLOY == 'on'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main -f sha="$GITHUB_SHA" -f after_ci=yes
