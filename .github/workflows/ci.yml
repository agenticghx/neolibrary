# Automatic checks GitHub runs on every pull request and on main.
# Once a night (08:00 UTC) the browser job runs every slice, including WebKit.
# The concurrency group includes the event name, so that night run does not
# cancel a pull request, and a pull request does not cancel the night run.
# The night run starts only after this file is on main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests
    # The night run is the browser job only. Lint already ran on the push to main.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + design-token rule)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test

  postgres:
    # Every other test uses PGlite (Postgres inside Node). This runs the
    # migrations and the data layer on a real Postgres through postgres.js,
    # the library production uses, so production-only database bugs fail here.
    name: Real Postgres (migrations, data layer)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations and data layer on Postgres 18 (same major version as Railway)
        run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  hygiene:
    name: PR hygiene (PROGRESS.md Log entry)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: node scripts/check-pr-hygiene.mjs origin/${{ github.base_ref }}

  e2e:
    # This name is a required check. Renaming it leaves branch protection
    # waiting for a check that no longer exists.
    name: Browser tests (screenshots + accessibility)
    runs-on: ubuntu-24.04
    permissions:
      contents: write        # push screenshots to the ci-screenshots branch
      pull-requests: write   # post the screenshot grid comment
    steps:
      - uses: actions/checkout@v5
        with:
          # The job can push screenshots. Do not leave that token in git
          # config while npm ci and Playwright run. The push step below
          # adds the token to its own remote. See docs/security-leftovers.md (B8).
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Choose which browser tests this change needs
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          all="screenshots,behavior,readalong,narration,webkit"
          emit() {
            slices="$1"
            if [ "$slices" = "none" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "slices=none" >> "$GITHUB_OUTPUT"
              echo "screenshots=false" >> "$GITHUB_OUTPUT"
              echo "webkit=false" >> "$GITHUB_OUTPUT"
              echo "No page, player, or audiobook code in this change. Browser tests are not run."
              return
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "slices=$slices" >> "$GITHUB_OUTPUT"
            case ",$slices," in
              *,screenshots,*) echo "screenshots=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "screenshots=false" >> "$GITHUB_OUTPUT" ;;
            esac
            case ",$slices," in
              *,webkit,*|*,readalong,*) echo "webkit=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "webkit=false" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "Browser slices: $slices"
          }
          # The night run judges WebKit even when the day's pull requests skipped it.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Nightly run: every browser test, including WebKit."
            emit "$all"
            exit 0
          fi
          list="$RUNNER_TEMP/changed-files.txt"
          : > "$list"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > "$list" || : > "$list"
          else
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq '.files[]?.filename' > "$list" || : > "$list"
          fi
          # An empty list (the API failed, or the commit touched too many files to list) runs every slice.
          answer=$(node scripts/ci-browser-needed.mjs "$list" || true)
          case "$answer" in
            slices=none) emit none ;;
            slices=*)
              rest="${answer#slices=}"
              if printf '%s' "$rest" | grep -Eq '^(screenshots|behavior|readalong|narration|webkit)(,(screenshots|behavior|readalong|narration|webkit))*$'; then
                emit "$rest"
              else
                echo "Unexpected slice list ('$answer'). Running every browser test."
                emit "$all"
              fi
              ;;
            *)
              echo "Unexpected classifier output ('$answer'). Running every browser test."
              emit "$all"
              ;;
          esac
      - name: Cache Playwright browsers
        if: steps.pages.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the browsers this change needs
        if: steps.pages.outputs.run == 'true'
        run: |
          set -euo pipefail
          if [ "${{ steps.pages.outputs.webkit }}" = "true" ]; then
            npx playwright install --with-deps chromium webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Playwright (screenshot comparison, axe-core accessibility)
        if: steps.pages.outputs.run == 'true'
        env:
          CI_BROWSER_SLICES: ${{ steps.pages.outputs.slices }}
        run: npx playwright test

      - name: Require the 2x2 screenshot grid
        if: always() && steps.pages.outputs.screenshots == 'true'
        run: |
          set -euo pipefail
          missing=0
          # Pages the screenshot projects always photograph, plus a spec page
          # only when that spec's project ran. The mini-player is photographed
          # by the audiobook file. See gridPageNames in scripts/ci-browser-needed.mjs.
          node scripts/ci-browser-needed.mjs --grid e2e/pages.ts "${{ steps.pages.outputs.slices }}" > "$RUNNER_TEMP/grid-pages.txt"
          mapfile -t pages < "$RUNNER_TEMP/grid-pages.txt"
          if [ "${#pages[@]}" -eq 0 ]; then
            echo "::error::the screenshot slice listed no pages"
            exit 1
          fi
          for page in "${pages[@]}"; do
            [ -n "$page" ] || continue
            for p in desktop-light desktop-dark phone-light phone-dark; do
              f="screenshots/$page-$p.png"
              if [ ! -f "$f" ]; then echo "::error::missing screenshot $f"; missing=1; fi
            done
          done
          exit $missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            screenshots/
          retention-days: 14

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'pull_request' && (hashFiles('screenshots/*.png') != '' || hashFiles('test-results/**/*-diff.png') != '')
        env:
          GH_TOKEN: ${{ github.token }}
          DEST: pr-${{ github.event.number }}/${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          work="$RUNNER_TEMP/shots"
          git init -q "$work"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git fetch -q --depth 1 origin ci-screenshots; then git checkout -q -B ci-screenshots FETCH_HEAD; else git checkout -q --orphan ci-screenshots; fi
            mkdir -p "$DEST"
            cp "$GITHUB_WORKSPACE"/screenshots/*.png "$DEST"/ 2>/dev/null || true
            # Failed screenshot comparisons: expected / actual / diff, so a
            # session without access to CI artifacts can see what changed.
            (cd "$GITHUB_WORKSPACE" && find test-results -name '*-actual.png' -o -name '*-expected.png' -o -name '*-diff.png') | while read -r f; do
              d="$DEST/failures/$(basename "$(dirname "$f")")"; mkdir -p "$d"; cp "$GITHUB_WORKSPACE/$f" "$d/"
            done
            git add "$DEST"
            git commit -q -m "Screenshots for $DEST" || true
            if git push -q origin ci-screenshots; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Post the screenshot grid on the PR
        if: always() && github.event_name == 'pull_request' && hashFiles('screenshots/*.png') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const sha = context.payload.pull_request.head.sha;
            const base = `https://github.com/${context.repo.owner}/${context.repo.repo}/raw/ci-screenshots/pr-${context.issue.number}/${sha}`;
            const files = fs.readdirSync("screenshots").filter((f) => f.endsWith(".png"));
            const pages = [...new Set(files.map((f) => f.replace(/-(desktop|phone)-(light|dark)\.png$/, "")))].sort();
            const img = (page, p) => `<img src="${base}/${page}-${p}.png" width="${p.startsWith("phone") ? 180 : 400}" alt="${page} ${p}">`;
            let body = `<!-- screenshot-grid -->\n## Screenshots for \`${sha.slice(0, 7)}\`\n\nPhone and desktop, light and dark. Made by the CI browser tests.\n`;
            for (const page of pages) {
              body += `\n### ${page}\n\n| | Light | Dark |\n|---|---|---|\n`;
              body += `| **Desktop** | ${img(page, "desktop-light")} | ${img(page, "desktop-dark")} |\n`;
              body += `| **Phone** | ${img(page, "phone-light")} | ${img(page, "phone-dark")} |\n`;
            }
            body += `\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number, per_page: 100 });
            const mine = comments.find((c) => c.body?.startsWith("<!-- screenshot-grid -->"));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
