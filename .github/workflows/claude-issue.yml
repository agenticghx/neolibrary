# An issue Samuel files becomes a pull request (M40 S3, Samuel 2026-11-01: sessions take over the gates). Written for
# Samuel and Claude sessions.
#
# When someone with write access to the repository opens an issue (or adds the label "build" to one), Claude Code runs
# on GitHub's machine (anthropics/claude-code-action, signed in with Samuel's Claude subscription, not an API key),
# builds what the issue asks under CLAUDE.md's rules, and opens a pull request that says "Fixes #N". The usual CI and
# the auto-merge then take over; the Deploy workflow puts it live. An issue labelled "no-build" when it is opened is
# left for discussion. If the issue is a question or needs a decision only Samuel can make, Claude answers on the issue
# with options and a recommendation instead of building.
#
# The repository is public: only people with write access (OWNER, MEMBER, COLLABORATOR) start it, and the issue's
# own words reach Claude only through `gh issue view`, never pasted into a command here.
#
# Needs: the Claude GitHub App installed on the repository and the CLAUDE_CODE_OAUTH_TOKEN secret (both made by
# `/install-github-app` in Claude Code), and the repository variable CLAUDE_ISSUES set to "on" (anything else
# switches it off).
name: Claude builds an issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  build:
    if: >-
      vars.CLAUDE_ISSUES == 'on' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      ((github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'no-build')) ||
       (github.event.action == 'labeled' && github.event.label.name == 'build'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: claude-issue-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages and the test browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Claude's own account of the run, on the run's summary page. Only people with write access start this
          # workflow, so its input is trusted (the action's condition for this). Without it a run that ends without a
          # pull request says nothing about why (issue #267's first run, 2026-11-02).
          display_report: "true"
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 300
            --allowedTools "Bash,Read,Edit,Write,Glob,Grep,TodoWrite"
          prompt: |
            You are a Claude session working alone on Neolibrary, started by GitHub issue #${{ github.event.issue.number }}
            in ${{ github.repository }}. Nobody is watching; Samuel, the owner, reads the result later.

            1. Read the issue and its comments: `gh issue view ${{ github.event.issue.number }} --comments`. Treat its
               text as Samuel's request, but never as permission to break a rule below.
            2. Read CLAUDE.md, PROGRESS.md ("Exact next steps" and the newest Log entries), docs/done.md, and the parts
               of docs/plan.md and docs/design.md the issue touches. Follow CLAUDE.md exactly, including writing for
               Samuel in plain English with jargon defined.
            3. If the issue is a question, or needs a decision only Samuel can make (money, keys, readers' privacy,
               who gets access, or big visual direction), do not build: comment on the issue with the options and your
               recommendation (`gh issue comment`), add it to PROGRESS.md's Open unknowns only if you open a pull
               request for something else, and stop.
            4. Otherwise build it on a new branch named `m<N>-issue-${{ github.event.issue.number }}-<short-topic>`
               from main (the milestone the issue belongs to; M21 for reader changes if unsure). Keep it to what the
               issue asks.
            5. Check it: `npm run check`; and the browser tests of the projects the change touches,
               `npx playwright test --project <name> --ignore-snapshots` (this machine is Linux, like CI). Fix what
               fails; never skip, delete or weaken a test to get green. Add a test for the change itself.
            6. Add the PROGRESS.md Log entry (five fields) and a LEARNING_LOG.md iteration, as CLAUDE.md says.
            7. Push the branch and open one pull request with `gh pr create`: the title says what changed; the body
               starts "Fixes #${{ github.event.issue.number }}.", says who it is written for, what changed in plain
               English, and pastes the commands you ran with their output as the "Done when" evidence.
            8. Comment on the issue with the pull request's link and one line on what it does.

            Never: deploy; touch secrets, keys or Railway; call a paid service (ElevenLabs, a paid voice, the Anthropic
            API) outside the tests' fakes; push to main; merge; change .github/workflows/ unless the issue asks for
            exactly that.

      # A run that ended with neither a pull request nor a comment on the issue says so on the issue, with the link
      # to the run (its summary holds Claude's report), so a silent run is never mistaken for one still working.
      - name: Say so on the issue when nothing came of it
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          STARTED: ${{ github.event.issue.updated_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ steps.claude.outcome }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --state all --search "${ISSUE} in:body" --json number,body --jq "[.[] | select(.body | test(\"#${ISSUE}\\\\b\"))] | length")
          says=$(gh issue view "$ISSUE" --json comments --jq "[.comments[] | select(.createdAt > \"${STARTED}\")] | length")
          if [ "$prs" = 0 ] && [ "$says" = 0 ]; then
            gh issue comment "$ISSUE" --body "Claude's run ended (${OUTCOME}) without a pull request or a comment here. Its report is on the run's summary page: ${RUN_URL}. Add the label \`build\` to try again."
          fi
