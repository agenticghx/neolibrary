<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Genealogy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ede1;--paper-raised:#faf6ee;--paper-sunken:#e9e1d1;--ink-900:#243239;--ink-700:#3c4b52;--ink-500:#5a676c;--rule:#d6ccba;--accent:#376963;--accent-strong:#2a524d;
  --org:#376963;--person:#8a5a2b;--money:#a0742a;--parts:#376963;--family:#6d5a96;--gk:#8b3fa8;--partner:#7a8a8f;--derived:#9a8f7c;--warn:#9b3b2e;--hl:#e6dcc4;
  --serif:"Source Serif 4","Iowan Old Style",georgia,serif;--sans:"Source Sans 3","Segoe UI","Helvetica Neue",arial,sans-serif;
  --r:6px;--shadow:0 1px 2px #24323914,0 4px 14px #2432390f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1b282f;--paper-raised:#22323a;--paper-sunken:#152026;--ink-900:#e7ddc9;--ink-700:#cdc3b0;--ink-500:#a49d8e;--rule:#34454d;--accent:#6b9f95;--accent-strong:#8bbab0;
  --org:#7fb3a8;--person:#d6a26a;--money:#d9b36c;--parts:#7fb3a8;--family:#ad9ad6;--gk:#d08ce8;--partner:#8e9ea3;--derived:#7d8a8a;--warn:#e08a7a;--hl:#2c3e46;--shadow:0 1px 2px #0005,0 4px 14px #0004;}}
:root[data-theme="dark"]{
  --paper:#1b282f;--paper-raised:#22323a;--paper-sunken:#152026;--ink-900:#e7ddc9;--ink-700:#cdc3b0;--ink-500:#a49d8e;--rule:#34454d;--accent:#6b9f95;--accent-strong:#8bbab0;
  --org:#7fb3a8;--person:#d6a26a;--money:#d9b36c;--parts:#7fb3a8;--family:#ad9ad6;--gk:#d08ce8;--partner:#8e9ea3;--derived:#7d8a8a;--warn:#e08a7a;--hl:#2c3e46;--shadow:0 1px 2px #0005,0 4px 14px #0004;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink-900);font:17px/1.45 var(--sans)}
main{max-width:1180px;margin:0 auto;padding:24px 16px 120px}
h1{font:600 2rem/1.15 var(--serif);margin:0 0 6px}
h2{font:600 1.25rem/1.2 var(--serif);margin:28px 0 8px}
p{margin:0 0 10px;max-width:72ch}
.lede{color:var(--ink-700)}
.for{font-size:.8125rem;color:var(--ink-500);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.stat{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);padding:8px 12px;min-width:118px}
.stat b{display:block;font:600 1.4rem/1.1 var(--serif)}
.stat span{font-size:.8125rem;color:var(--ink-500)}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);margin:18px -16px 0;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.tabs{display:flex;gap:4px;background:var(--paper-sunken);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;font:500 .9375rem var(--sans);color:var(--ink-700);padding:7px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--paper-raised);color:var(--ink-900);box-shadow:var(--shadow)}
.upto{display:flex;align-items:center;gap:10px;flex:1 1 320px;min-width:0}
.upto label{font-size:.9375rem;color:var(--ink-700);white-space:nowrap}
.upto input{flex:1;min-width:100px;accent-color:var(--accent)}
.upto output{font-size:.875rem;color:var(--ink-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
.pick{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 6px}
.pick input{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper-raised);color:var(--ink-900);width:min(320px,100%)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper-raised);color:var(--ink-900);border-radius:999px;padding:4px 11px;font:500 .875rem var(--sans);cursor:pointer;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip small{color:var(--ink-500);font-weight:400}
.chip.person{border-left:3px solid var(--person)}
.chip.organisation{border-left:3px solid var(--org)}
.hint{font-size:.875rem;color:var(--ink-500)}
/* tree */
.tree{position:relative;margin-top:10px;padding:6px 0}
.tree svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.gen{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 14px;margin:0 0 46px;position:relative}
.genlabel{position:absolute;left:0;top:-20px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)}
.card{position:relative;background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 12px 9px;min-width:130px;max-width:230px;cursor:pointer;text-align:center}
.card:hover{border-color:var(--accent)}
.card .nm{font:600 1rem/1.2 var(--serif)}
.card .how{font-size:.78rem;color:var(--ink-500);margin-top:3px}
.card.focus{border:2px solid var(--accent);background:var(--hl)}
.card.focus .nm{font-size:1.2rem}
.more{align-self:center;font-size:.85rem;color:var(--ink-500)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.85rem;color:var(--ink-700);margin-top:4px}
.legend i{display:inline-block;width:26px;height:0;border-top:2px solid var(--org);vertical-align:middle;margin-right:6px}
.legend i.d{border-top:2px dashed var(--derived)}
/* org chart */
.orghead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0 4px}
.orghead .nm{font:600 1.6rem/1.15 var(--serif)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}
.group{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px}
.group h3{margin:0 0 8px;font:600 .8125rem var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)}
.group .chips{display:flex;flex-wrap:wrap;gap:6px}
/* person path */
.path{list-style:none;margin:14px 0 0;padding:0 0 0 22px;border-left:2px solid var(--rule)}
.path li{position:relative;margin:0 0 14px;padding-left:10px}
.path li::before{content:"";position:absolute;left:-29px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--person)}
.path li.org::before{border-color:var(--org)}
.path .ch{font-size:.78rem;color:var(--ink-500)}
.path .what{font-weight:500}
.path .what button{font:inherit;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.path q{display:block;font:400 .95rem/1.5 var(--serif);color:var(--ink-700);margin-top:2px}
.path .ev{font-size:.8rem;border:0;background:none;color:var(--ink-500);cursor:pointer;padding:0;text-decoration:underline}
/* drawer */
.drawer{position:fixed;right:16px;bottom:16px;width:min(460px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;background:var(--paper-raised);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 40px #0003;padding:14px 16px 16px;z-index:20}
.drawer[hidden]{display:none}
.drawer .x{position:sticky;top:0;float:right;border:0;background:var(--paper-sunken);color:var(--ink-900);border-radius:999px;width:30px;height:30px;font-size:18px;cursor:pointer}
.drawer h3{font:600 1.1rem/1.25 var(--serif);margin:2px 40px 10px 0}
.ev-item{border-top:1px solid var(--rule);padding:10px 0}
.ev-item:first-of-type{border-top:0}
.ev-item .s{font-weight:600}
.ev-item blockquote{margin:6px 0;padding:6px 10px;border-left:3px solid var(--accent);background:var(--paper);font:400 1rem/1.55 var(--serif);color:var(--ink-900)}
.ev-item .meta{font-size:.8rem;color:var(--ink-500)}
.badge{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-700);margin-left:4px}
.badge.fix{border-color:var(--warn);color:var(--warn)}
.badge.inf{border-style:dashed}
.drawer .go{margin-top:8px}

.orghead .tabs{margin-left:auto}
.tabs.small button{padding:5px 12px;font-size:.875rem}
.legend i.sw{display:inline-block;width:13px;height:13px;border:0;border-radius:50%;background:var(--c);vertical-align:-2px;margin-right:6px}
.legend svg{vertical-align:-2px;margin-right:6px}
.legend i.sw.ring{background:transparent;border:2.5px solid var(--c);box-sizing:border-box}
.svgbox{max-width:920px;margin:6px auto 0;overflow-x:auto}
svg.orbit{width:100%;min-width:700px;height:auto;display:block}
.ring{fill:none;stroke:var(--rule);stroke-dasharray:2 5}
.catarc{fill:none;stroke-width:7;stroke-linecap:round;opacity:.5}
.spoke{opacity:.5;transition:opacity .2s}
.spoke.dashed,.ribbon.dashed{stroke-dasharray:6 5}
.spoke.dim{opacity:.07}.node.dim{opacity:.28}
.node{cursor:pointer;transition:opacity .2s}.node:focus{outline:none}
.lbl,.sub{paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.lbl{font:600 15px var(--serif);fill:var(--ink-900)}
.sub{font:12px var(--sans);fill:var(--ink-500)}
.hub{fill:var(--hl);stroke:var(--accent);stroke-width:2.5}
.hubtxt{font:600 21px var(--serif);fill:var(--ink-900)}
.ringlbl{font:600 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;fill:var(--ink-500)}
.flow{position:relative;display:grid;grid-template-columns:1fr minmax(270px,1.3fr) 1fr;grid-template-areas:"up up up" "in core out" "down down down";gap:34px 76px;margin-top:16px}
.ribbons{position:absolute;inset:0;pointer-events:none;overflow:visible}
.ribbon{fill:none;opacity:.33}
.fcol{display:flex;flex-direction:column;gap:8px;justify-content:center;position:relative;z-index:1}
.fcol-up,.fcol-down{flex-direction:row;flex-wrap:wrap;justify-content:center}
.fcol-up{grid-area:up}.fcol-in{grid-area:in}.fcol-out{grid-area:out}.fcol-down{grid-area:down}
.fcol-up .fhead,.fcol-down .fhead{width:100%;text-align:center}
.fnode{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--paper-raised);border:1px solid var(--rule);border-left:4px solid var(--c);border-radius:6px;padding:6px 10px;box-shadow:var(--shadow)}
.fnode:focus-visible{outline:2px solid var(--accent)}
.fcol-out .fnode{border-left:1px solid var(--rule);border-right:4px solid var(--c);text-align:right}
.fnode b{display:block;font:600 .95rem/1.2 var(--serif)}.fnode small{color:var(--ink-500);font-size:.75rem}
.fcore{grid-area:core;position:relative;z-index:1;background:var(--paper-raised);border:2px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.corename{font:600 1.5rem/1.15 var(--serif);text-align:center;margin-bottom:8px}
.crow{border-top:1px solid var(--rule);padding:8px 0 6px}
.fhead{font:600 .72rem var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-500);margin-bottom:6px}
.succession{display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding-left:10px;border-left:2px solid var(--person)}
.crow .chips{display:flex;flex-wrap:wrap;gap:5px}
.tlbox{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper-raised);margin-top:8px}
.timeline{display:block}
.band.b0{fill:var(--paper-raised)}.band.b1{fill:var(--paper-sunken);opacity:.6}
.partlbl{font:600 11px var(--sans);fill:var(--ink-500);letter-spacing:.04em}
.chlbl{font:11px var(--sans);fill:var(--ink-500)}
.unread{fill:var(--paper);opacity:.8}
.nowline{stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 3}
.grouplbl{font:600 11px var(--sans);letter-spacing:.08em;fill:var(--ink-500)}
.rowname{font:600 14px var(--serif);fill:var(--ink-900);cursor:pointer;dominant-baseline:middle}
.rowsub{font:11px var(--sans);fill:var(--ink-500)}
.rowrule{stroke:var(--rule);stroke-width:.6}
.span{stroke-width:3.5;opacity:.3;stroke-linecap:round}
.mark{cursor:pointer}.mark:focus{outline:none}.mark:focus circle,.mark:focus path,.mark:focus rect+*{stroke-width:3.5}
@media (max-width:700px){.rowname{font-size:13px}.flow{grid-template-columns:1fr;grid-template-areas:"up" "in" "core" "out" "down";gap:20px}.flow .ribbons{display:none}.fcol-out .fnode{text-align:left;border-right:1px solid var(--rule);border-left:4px solid var(--c)}.orghead .tabs{margin-left:0;width:100%}}

.story-box{margin-top:8px}
.story .lane.l0{fill:var(--paper-raised)}.story .lane.l1{fill:var(--paper-sunken);opacity:.55}
.lanelbl{font:600 13px var(--sans);letter-spacing:.02em;fill:var(--ink-700);cursor:pointer}.lanelbl.pl{fill:var(--person)}
.yr{font:600 13px var(--sans);fill:var(--ink-900)}.yr.none{fill:var(--ink-500);font-weight:400}
.lifeline{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.stop{fill:var(--paper);stroke:var(--accent);stroke-width:2.5}.stop.dated{fill:var(--accent)}.stop.x{stroke:var(--warn);stroke-width:3;fill:none}
.evlbl{font:12px var(--sans);fill:var(--ink-700);paint-order:stroke;stroke:var(--paper-raised);stroke-width:3px}
.mateline{stroke:var(--ink-500);stroke-width:2.5;opacity:.35;stroke-linecap:round}
.matelbl{font:italic 11.5px var(--serif);fill:var(--ink-500)}
.mate{cursor:pointer}.mate:hover .mateline{opacity:.7}
.legend .sw.hollow{background:var(--paper);border:2px solid var(--accent);box-sizing:border-box}
.legend i.mt{display:inline-block;width:26px;height:0;border-top:3px solid var(--ink-500);opacity:.45;vertical-align:middle;margin-right:6px}
.yrk{font:600 .85rem var(--sans)}.yrk.none{color:var(--ink-500)}
.rvhline{fill:none;stroke-width:2;opacity:.55;transition:opacity .15s}.rvhline.dim{opacity:.05}
.axis{stroke:var(--rule)}.axlbl{font:600 11px var(--sans);letter-spacing:.06em;fill:var(--ink-500)}
.badge.b-stated{border-color:var(--accent);color:var(--accent)}.badge.b-worked{border-color:var(--money);color:var(--money)}.badge.b-ordered{border-style:dashed}.badge.b-unknown{color:var(--ink-500)}
.yrinline{font-weight:600;color:var(--ink-900)}

.settings{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;margin:10px 0 4px;display:flex;flex-direction:column;gap:8px}
.setting{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:.92rem;color:var(--ink-700)}
.settings .hint{margin:0;font-size:.82rem;max-width:none}
.banner{background:var(--hl);border-left:4px solid var(--money);border-radius:var(--r);padding:10px 12px;margin:10px 0;font-size:.95rem;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.yr.gk,.yrk.gk,.yrinline.gk{fill:var(--gk);color:var(--gk);font-style:italic}
.stop.gk{fill:var(--gk);stroke:var(--gk)}
.badge.b-gk{border-color:var(--gk);color:var(--gk)}
.gkitem{border-left:3px solid var(--gk);padding-left:10px}
details{margin-top:26px;background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);padding:10px 14px}
details summary{cursor:pointer;font-weight:600}
.removed{font-size:.9rem}
.removed div{border-top:1px solid var(--rule);padding:7px 0}
.removed em{color:var(--ink-500)}
.skill{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:8px}
.step{background:var(--paper-raised);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px;font-size:.92rem}
.step b{display:block;font:600 1rem var(--serif);margin-bottom:2px}
.empty{color:var(--ink-500);font-style:italic;margin:20px 0}
@media (max-width:640px){.tabs{width:100%}.tabs button{flex:1;padding:7px 6px;font-size:.875rem}h1{font-size:1.6rem}.card{min-width:110px;max-width:170px;padding:7px 9px}.gen{gap:10px;margin-bottom:40px}.upto output{max-width:130px}}
</style>
</head>
<body>
<main>
  <header id="intro"></header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="View">
      <button data-v="tree" aria-pressed="true">Family tree</button>
      <button data-v="org" aria-pressed="false">Inside a company</button>
      <button data-v="person" aria-pressed="false">One person</button>
    </div>
    <div class="upto">
      <label for="upto">Read up to chapter</label>
      <input id="upto" type="range" min="1" max="2" value="2">
      <output id="uptoOut"></output>
    </div>
  </div>

  <section id="view"></section>

  <details>
    <summary id="removedSum">Links the second reading removed</summary>
    <p class="hint">Each had a real quote, but the paragraph does not say the link. Shown so you can judge the second reading too.</p>
    <div class="removed" id="removed"></div>
  </details>
</main>

<div class="drawer" id="drawer" hidden role="dialog" aria-label="Where the book says it"><button class="x" id="dx" aria-label="Close">×</button><div id="dbody"></div></div>

<script>
const D = /*DATA*/null;
const REL = {founded:"founded",worked_at:"worked at",led:"led",left:"left",advised:"advised",spun_out_of:"spun out of",acquired:"bought",bought_part_of:"bought part of",part_of:"is part of",funded:"funded",supplied:"supplied",partnered:"partnered with",mentored:"mentored",hired:"hired",worked_for:"worked for",friend:"is a friend of",family:"is family of"};
const kindOf = n => D.nodes[n] || "organisation";
let view = "tree", upto = D.n;
const focus = {tree: D.top.tree[0] || D.top.org[0] || "", org: D.top.org[0] || "", person: D.top.person[0] || ""};
const PARTS = D.parts;
const $ = s => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v != null) e.setAttribute(k, v); } for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(String(k))); return e; };
const live = () => D.links.filter(l => l.chapter <= upto);
const sentence = l => `${l.from} ${REL[l.relation] || l.relation} ${l.to}`;


// ---------- intro: what this page is, from the run's own numbers ----------
function intro() {
  const s = D.stats, c = s.checked || {};
  document.title = `${D.book}: genealogy`;
  const step = (n, t, body) => el("div", {class: "step"}, el("b", {}, `${n}. ${t}`), body);
  $("#intro").replaceChildren(
    el("div", {class: "for"}, `Genealogy · ${D.book} · read by Claude on the owner's subscription · keep private: it quotes the book`),
    el("h1", {}, `${D.book}: genealogy`),
    el("p", {class: "lede"}, `Every `, el("b", {}, "link"), ` the book states between two named people or organisations (who founded what, who worked or led where, which company came out of which, who bought, funded or supplied whom), each with the sentence it rests on. Tap anything to see that sentence.`),
    el("div", {class: "stats", id: "stats"}),
    el("h2", {}, "How it was made"),
    el("div", {class: "skill"},
      step(1, "Read", `Each of ${s.chapters} chapters went to Claude with its paragraphs numbered; it answered with links: from, relation, to, the paragraph and a quote.`),
      step(2, "Check the quote", `A link whose quote is not found word for word in its paragraph is dropped: ${s.dropped} were.`),
      step(3, "Names", `A names reading grouped ${s.merged} other spellings into the names they belong to and set aside ${s.vague} vague groups.`),
      step(4, "Second reading", `Each link was read again against its paragraph: ${c.holds || 0} held, ${c.fixed || 0} were corrected, ${(c.unsupported || 0) + (c.fix_unusable || 0)} were removed.`),
      step(5, "Dates", `Each chapter was read whole for the year of each link, with the words that say it, checked like the quotes: ${s.dated} links got a year.`),
      step(6, "Lives", `For ${s.lives} people, repeated links were merged into life events in the order they happened, by a checked year or a quoted clue. Years the book leaves out come from Claude's general knowledge, drawn in purple and never mixed with the book's.`)));
}

// ---------- stats ----------
function stats() {
  const s = D.stats, c = s.checked;
  const box = (n, t) => el("div", {class: "stat"}, el("b", {}, n), el("span", {}, t));
  $("#stats").replaceChildren(box(s.chapters, "chapters read"), box(s.offered, "links offered"), box(s.dropped, "quotes not in the book"),
    box(c.fixed || 0, "corrected by the second reading"), box((c.unsupported || 0) + (c.fix_unusable || 0), "removed by the second reading"),
    box(D.links.length, "links shown"), box(Object.keys(D.nodes).length, "names"));
  void c;
}

// ---------- evidence drawer ----------
function openEvidence(title, items, go) {
  const body = $("#dbody"); body.replaceChildren(el("h3", {}, title));
  for (const it of items) {
    const l = it.link || it, badges = [];
    if (l.was) badges.push(el("span", {class: "badge fix", title: l.why || ""}, "corrected"));

    marks.append(S("g", {class: "mark", role: "button", tabindex: 0, onclick: () => eventEvidence(p, e), onmouseenter: () => hi(i), onmouseleave: () => hi(null), onfocus: () => hi(i)},
      S("circle", {cx: ex(i), cy: yBot, r: 6.5, fill: e.start_year ? col : "var(--paper)", stroke: col, "stroke-width": 2.5}),
      S("text", {x: ex(i), y: yBot + 26, "text-anchor": "middle", class: "yr " + yearKind(e)}, yearText(e) || "·"),
      S("text", {x: ex(i), y: yBot + 42, "text-anchor": "middle", class: "evlbl"}, lbl.map((t, k) => S("tspan", {x: ex(i), dy: k ? 12 : 0}, t)))));
  });
  const hi = k => lines.querySelectorAll("path").forEach(pth => pth.classList.toggle("dim", k != null && +pth.dataset.e !== k));
  svg.append(lines, marks);
  const told = E.reduce((s, e) => s + e.ls.length, 0), back = [];
  E.forEach((e, i) => E.forEach((f, j) => { if (j > i && f.first < e.first) back.push([e, f]); }));
  stage.append(el("p", {class: "hint"}, `The book tells ${p}'s ${E.length} steps ${told} times. Where lines cross, the book tells a later step before an earlier one (a flashback)${back.length ? `: ${back.length} pairs here` : ": none here"}. Fans of lines are steps the book comes back to.`),
    el("div", {class: "tlbox"}, svg), el("p", {class: "hint"}, "Point at or tap a step to light its lines."));
}

// C. The plain list, in true order, with how each step was placed.
function drawLifeList(stage, p, E) {
  const ol = el("ol", {class: "path"});
  for (const e of E) {
    ol.append(el("li", {class: e.kind === "organisation" ? "org" : ""},
      el("div", {class: "ch"}, yearText(e) ? el("b", {class: "yrinline " + yearKind(e)}, yearText(e)) : "", " ", yearKind(e) === "gk" ? el("span", {class: "badge b-gk"}, "year from general knowledge") : null, " ", el("span", {class: "badge " + BASIS[e.basis]?.[1]}, BASIS[e.basis]?.[0] || e.basis), ` · told in chapter${e.ls.length > 1 ? "s" : ""} ${[...new Set(e.ls.map(l => l.chapter))].join(", ")}`),
      el("div", {class: "what"}, e.verb, " ", el("button", {onclick: () => show(e.kind === "person" ? "person" : "org", e.other)}, e.other), e.role ? ` (${e.role})` : ""),
      el("q", {}, e.ls[0].quote),
      el("div", {class: "hint"}, e.why || ""),
      el("button", {class: "ev", onclick: () => eventEvidence(p, e)}, "where the book says it, and how it was placed")));
  }
  stage.append(ol);
}

// ---------- shared ----------
function picker(names, v, sugg) {
  const id = "dl-" + v, inp = el("input", {list: id, placeholder: v === "person" ? "Find a person" : "Find an organisation", "aria-label": "Find a name"});
  const dl = el("datalist", {id}, names.map(n => el("option", {value: n})));
  inp.addEventListener("change", () => { if (names.includes(inp.value)) show(v, inp.value); });
  return el("div", {class: "pick"}, inp, dl, el("div", {class: "sugg"}, sugg.filter(n => names.includes(n)).map(n => el("button", {class: "chip " + kindOf(n), "aria-pressed": String(n === focus[v]), onclick: () => show(v, n)}, n))));
}
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === view)));
  $("#uptoOut").textContent = `${upto}. ${D.chapters[upto]}`;
  const box = $("#view"); box.replaceChildren(); window.onresize = null;
  ({tree: renderTree, org: renderOrg, person: renderPerson})[view](box);
}
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { view = b.dataset.v; render(); });
$("#upto").oninput = e => { upto = +e.target.value; render(); };
$("#removedSum").textContent = `Links the second reading removed (${D.doubted.length})`;
$("#removed").replaceChildren(...D.doubted.sort((a, b) => a.chapter - b.chapter).map(l => el("div", {}, el("b", {}, sentence(l)), ` · ch ${l.chapter} · `, el("em", {}, l.why || ""), el("div", {class: "hint"}, `"${l.quote}"`))));
intro(); stats(); $("#upto").max = D.n; $("#upto").value = D.n; render();
</script>
